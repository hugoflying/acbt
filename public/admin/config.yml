    widget: text
    required: false
  - name: licences
    label: Licences proposées et heures de vol estimées
    widget: list
    fields:
    - name: code
      label: Code (LAPL
      widget: string
      required: false
    - name: nom
      label: Nom affiché
      widget: string
      required: false
    - name: resume
      label: En une phrase
      widget: string
      required: false
    - name: heures_double
      label: Heures avec instructeur (estimation courante)
      widget: number
      value_type: float
      required: false
    - name: heures_solo
      label: Heures seul à bord (estimation courante)
      widget: number
      value_type: float
      required: false
    - name: heures_double_min
      label: Heures avec instructeur (minimum réglementaire)
      widget: number
      value_type: float
      required: false
    - name: heures_solo_min
      label: Heures seul à bord (minimum réglementaire)
      widget: number
      value_type: float
      required: false
    required: false
    hint: Les prix de l'heure viennent de la fiche du premier avion école, l'adhésion, les blocs et les aides de la rubrique Tarifs. Heures « minimum » = minimum réglementaire ; heures sans « minimum »
      = estimation courante, à ajuster par les instructeurs.
