# Back-office Sveltia CMS (essai, en parallèle de Pages CMS).
# Fichier généré à partir de .pages.yml : garder les deux en phase.
# Ouvrir https://hugoflying.github.io/acbt/admin/
backend:
  name: github
  repo: hugoflying/acbt
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: 'Ajout : {{collection}} « {{slug}} » (back-office)'
    update: 'Modification : {{collection}} « {{slug}} » (back-office)'
    delete: 'Suppression : {{collection}} « {{slug}} » (back-office)'
    uploadMedia: Ajout du fichier {{path}} (back-office)
    deleteMedia: Suppression du fichier {{path}} (back-office)
app_title: Back-office ACBT
logo:
  src: /acbt/uploads/logo/logo-acbt.png
site_url: https://hugoflying.github.io/acbt
media_folder: public/uploads
public_folder: /uploads
output:
  omit_empty_optional_fields: false
collections:
- name: actualites
  label: Actualités
  icon: newspaper
  label_singular: Actualité
  folder: src/content/actualites
  create: true
  extension: md
  format: frontmatter
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  sortable_fields:
    fields:
    - date
    - titre
    default:
      field: date
      direction: descending
  summary: '{{titre}} · {{date | date(''DD/MM/YYYY'')}}'
  preview_path: actualites/{{slug}}
  identifier_field: titre
  media_folder: /public/uploads/actualites
  public_folder: /uploads/actualites
  fields:
  - name: titre
    label: Titre
    widget: string
    required: true
  - name: date
    label: Date
    widget: datetime
    format: YYYY-MM-DD
    time_format: false
    required: true
  - name: image
    label: Photo principale
    widget: image
    required: false
    hint: Affichée sur la carte de l’actualité et en haut de l’article. Sans photo, un visuel aux couleurs du club est utilisé.
  - name: galerie
    label: Galerie photos
    widget: image
    multiple: true
    required: false
  - name: publie
    label: Publiée sur le site
    widget: boolean
    required: false
    hint: Décochez pour garder un brouillon sans le montrer.
    default: true
  - name: body
    label: Texte
    widget: richtext
    required: false
- name: avions
  label: Avions
  description: Fiches, photos et prix de l'heure
  icon: flight
  label_singular: Avion
  folder: src/content/avions
  create: true
  extension: yml
  format: yaml
  slug: '{{slug}}'
  identifier_field: nom
  sortable_fields:
  - ordre
  - nom
  media_folder: /public/uploads/avions
  public_folder: /uploads/avions
  fields:
  - name: nom
    label: Nom affiché
    widget: string
    required: true
  - name: immatriculation
    label: Immatriculation
    widget: string
    required: false
  - name: type
    label: Type exact
    widget: string
    required: true
    hint: 'Exemple : Robin DR400-120'
  - name: puissance
    label: Puissance (ch)
    widget: number
    value_type: float
    required: false
  - name: places
    label: Nombre de places
    widget: number
    value_type: float
    required: false
  - name: usage
    label: Usage
    widget: string
    required: false
    hint: 'Exemple : École et voyage'
  - name: description
    label: Description
    widget: text
    required: false
  - name: photos
    label: Photos (la première est la photo principale)
    widget: image
    multiple: true
    required: false
  - name: tarifs
    label: Tarifs horaires
    widget: list
    fields:
    - name: a_partir_du
      label: Applicable à partir du
      widget: datetime
      format: YYYY-MM-DD
      time_format: false
      required: true
    - name: prix_heure
      label: Prix de l'heure en solo (€)
      widget: number
      value_type: float
      required: true
    - name: prix_instruction
      label: Prix de l'heure en double commande
      widget: number
      value_type: float
      required: false
    - name: note
      label: Note interne
      widget: string
      required: false
    required: false
    hint: Ajoutez une ligne avec une date future pour planifier un changement de tarif. Le site affiche automatiquement le bon tarif à chaque date.
  - name: ordre
    label: Ordre d'affichage
    widget: number
    value_type: float
    required: false
    default: 10
  - name: actif
    label: Avion affiché sur le site
    widget: boolean
    required: false
    hint: Décochez pour retirer un avion sans le supprimer.
    default: true
- name: documents
  label: Documents membres
  description: PDF, liens et vidéos de l’espace membre
  icon: folder_open
  label_singular: Document
  folder: src/content/documents
  create: true
  extension: yml
  format: yaml
  slug: '{{slug}}'
  identifier_field: titre
  media_folder: /public/uploads/membre
  public_folder: /uploads/membre
  fields:
  - name: titre
    label: Titre
    widget: string
    required: true
  - name: categorie
    label: Rubrique de l'espace membre
    widget: select
    options:
    - Vie du club
    - Documentation pilote
    - Documentation avion
    - Pour les élèves
    - Examens
    - Examen pratique
    - Sécurité
    - Préparation des vols
    - Météo
    - Formulaires
    required: true
  - name: avions
    label: Avion(s) concerné(s) (seulement pour « Documentation avion »)
    widget: select
    options:
    - F-GCAL
    - F-BXEK
    - F-BTBS
    - F-BIXA
    multiple: true
    required: false
  - name: rubrique
    label: Type de document avion
    widget: select
    options:
    - Manuel de vol
    - Paramètres
    - Check-list
    - Centrage
    - Guide radio rapide
    - Radio VFR
    - Transpondeur
    - DME
    - Balise de détresse
    - Autre
    required: false
  - name: fichier
    label: Fichier (PDF
    widget: file
    required: false
    hint: Déposez le fichier ici, ou remplissez plutôt le lien ci-dessous.
  - name: lien
    label: Ou lien vers un site / une vidéo
    widget: string
    required: false
  - name: description
    label: Description
    widget: string
    required: false
  - name: mis_a_jour
    label: Date de mise à jour
    widget: datetime
    format: YYYY-MM-DD
    time_format: false
    required: false
  - name: ordre
    label: Ordre d'affichage (petit = en premier)
    widget: number
    value_type: float
    required: false
    default: 10
